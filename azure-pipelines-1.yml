trigger: none

pool:
  vmImage: ubuntu-latest

steps:
- task: JfrogCliV2@1
  displayName: 'Run SAST Scan'
  inputs:
    jfrogArtifactoryService: 'JFrogCLI-v2' #project settingsで作成した名前
    command: 'jf --version'